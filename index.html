<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Chispamental — Juega y piensa</title>
<meta name="description" content="Plataforma de juegos educativos para niños: matemática rápida, memoria, lógica y trivia escolar, con niveles y misiones." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2222%22>⚡</text></svg>" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
<meta name="theme-color" content="#b34d00" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Chispamental" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/tokens.css" />
<link rel="stylesheet" href="assets/css/mascot.css" />
<link rel="stylesheet" href="assets/css/components.css" />
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="bolt">⚡</span> Chispamental</div>
  <div class="topbar-actions">
    <button id="btn-mute" class="icon-btn" aria-label="Silenciar sonido">🔊</button>
    <button id="btn-home" class="ghost-btn" hidden>⟵ Menú</button>
  </div>
</header>

<main id="app">

  <!-- HOME -->
  <section id="screen-home" class="screen">
    <div class="profile-row">
      <div class="mascot-game-wrap">
        <div id="mascot-home"></div>
        <div id="home-speech" class="mascot-speech"></div>
      </div>
      <div class="profile-info">
        <div class="profile-level">Nivel <span id="profile-level">1</span> · <span id="profile-skin">Chispi clásico</span></div>
        <div class="xp-bar-wrap"><div id="xp-bar" class="xp-bar" style="width:0%"></div></div>
        <div class="xp-label" id="xp-label">0 / 100 XP</div>
      </div>
      <button id="btn-progress" class="icon-btn" aria-label="Ver mi progreso">📊</button>
    </div>

    <div id="daily-banner" class="daily-banner"></div>

    <p class="tagline">Elige una misión y ayuda a Chispi a resolver retos de matemática, memoria, lógica y cultura escolar.</p>

    <div class="mode-grid" id="mode-grid"></div>

    <div class="difficulty-picker">
      <span class="label">Nivel</span>
      <div class="band-grid" id="band-grid"></div>
    </div>

    <button id="btn-play" class="play-btn">Jugar ⚡</button>
    <p id="best-score" class="best-score"></p>
  </section>

  <!-- PROGRESO -->
  <section id="screen-progress" class="screen" hidden>
    <h2 class="display" style="text-align:center; margin-bottom: 6px;">Mi progreso</h2>
    <p class="tagline">Así vas en cada habilidad. Cuanto más juegas, más se afina.</p>
    <div id="progress-list" class="progress-list"></div>
    <button id="btn-progress-back" class="ghost-btn-lg">⟵ Volver</button>
  </section>

  <!-- MISSION INTRO -->
  <section id="screen-mission" class="screen" hidden>
    <div class="result-card">
      <div id="mascot-mission"></div>
      <h2 id="mission-title">Misión</h2>
      <p id="mission-text" class="result-detail"></p>
      <div class="result-actions">
        <button id="btn-start-mission" class="play-btn">Empezar ⚡</button>
      </div>
    </div>
  </section>

  <!-- GAME -->
  <section id="screen-game" class="screen" hidden>
    <div class="hud">
      <div class="mascot-game-wrap">
        <div id="mascot-game"></div>
        <div id="mascot-speech" class="mascot-speech"></div>
      </div>
      <div class="hud-item">Puntos <span id="hud-score">0</span></div>
      <div class="hud-item">Racha <span id="hud-streak">0</span></div>
    </div>
    <div id="mission-strip" class="mission-strip"></div>
    <div id="timer-bar-wrap" class="timer-bar-wrap"><div id="timer-bar" class="timer-bar"></div></div>

    <div id="quiz-area" class="quiz-area" hidden>
      <p id="question-subject" class="question-subject"></p>
      <h2 id="question-text" class="question-text"></h2>
      <div id="answers" class="answers-grid"></div>
      <p id="question-hint" class="question-hint"></p>
    </div>

    <div id="memory-area" class="memory-area" hidden>
      <div id="memory-grid" class="memory-grid"></div>
    </div>
  </section>

  <!-- RESULT -->
  <section id="screen-result" class="screen" hidden>
    <div class="result-card">
      <div id="mascot-result"></div>
      <h2 id="result-title">¡Bien hecho!</h2>
      <p id="result-detail" class="result-detail"></p>
      <p id="result-record" class="result-record"></p>
      <p id="result-xp" class="result-xp"></p>
      <button id="band-suggestion" class="band-suggestion-chip" hidden></button>
      <div class="result-actions">
        <button id="btn-retry" class="play-btn">Jugar de nuevo</button>
        <button id="btn-menu" class="ghost-btn-lg">Cambiar modo</button>
      </div>
    </div>
  </section>

</main>

<footer class="footer">Chispamental</footer>

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
